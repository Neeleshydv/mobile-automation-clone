[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v -s --html=reports/mobile_report.html --self-contained-html
markers =
    android: Android mobile test cases (UiAutomator2)
    ios: iOS mobile test cases (XCUITest)
    smoke: Critical mobile smoke tests
    regression: Comprehensive mobile regression scenarios
    biometrics: Face ID & Fingerprint mobile authentication
    iap: Mobile In-App Purchases (StoreKit & Google Play)
