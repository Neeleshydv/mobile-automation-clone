name: Mobile App CI/CD Test Pipeline (Android & iOS)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * *' # Nightly run at 3:00 AM UTC
  workflow_dispatch:
    inputs:
      target_platform:
        description: 'Target Mobile Platform'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - android
          - ios

jobs:
  # 1. Android Test Execution Job (Runs on standard Ubuntu runner)
  android-test-suite:
    name: Android Mobile Tests (UiAutomator2)
    runs-on: ubuntu-latest
    if: github.event.inputs.target_platform == 'all' || github.event.inputs.target_platform == 'android' || github.event_name == 'push'

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set Up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 3. Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Execute Android Automated Tests
        env:
          PLATFORM: android
          EMULATION_MODE: "True"
        run: |
          pytest -m android --html=reports/android_report.html --self-contained-html

      - name: 5. Archive Android Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-execution-report
          path: reports/android_report.html

  # 2. iOS Test Execution Job (MUST run on macOS runner for Xcode / XCUITest!)
  ios-test-suite:
    name: iOS Mobile Tests (XCUITest on macOS)
    runs-on: macos-14
    if: github.event.inputs.target_platform == 'all' || github.event.inputs.target_platform == 'ios' || github.event_name == 'push'

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set Up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 3. Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Execute iOS Automated Tests
        env:
          PLATFORM: ios
          EMULATION_MODE: "True"
        run: |
          pytest -m ios --html=reports/ios_report.html --self-contained-html

      - name: 5. Archive iOS Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-execution-report
          path: reports/ios_report.html
